{% with buttons=floating.buttons %}
  {% if buttons %}
    <div class="floating" id="floatingButtons" aria-label="Quick contact">
      {% for button in buttons %}
        <a class="floating__btn floating__btn--{{ button.type }}" href="{{ button.url }}"
           {% if button.type == 'instagram' or button.type == 'whatsapp' %}target="_blank" rel="noopener"{% endif %}
           aria-label="{{ button.label }}" style="--i: {{ forloop.counter0 }}">
          <i data-lucide="{{ button.icon }}"></i>
          <span class="floating__tip">{{ button.label }}</span>
        </a>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
